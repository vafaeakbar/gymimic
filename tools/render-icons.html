<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MimicGYM icon renderer</title>
  <!-- Renders the app icons and the 1200×630 share card from their sources:
       icons/favicon.svg (product symbol) and icons/by-alajeer-dark.svg (official sign-off).
       Open via the local server (python3 serve.py → http://localhost:5173/tools/render-icons.html),
       click "Download all", and move the files into icons/. Then run:  python3 tools/build_favicon.py -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
  <style>
    body { background: #222; color: #eee; font: 14px system-ui, sans-serif; padding: 20px; }
    canvas { display: block; margin: 12px 0; max-width: 100%; outline: 1px solid #444; }
  </style>
</head>
<body>
  <button id="dl">Download all</button>
  <div id="out"></div>
  <script type="module">
    import { drawFigure } from "../js/figure.js";
    import { punch } from "../js/moves/punch.js";

    const load = (src) => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; });
    await document.fonts.load("800 100px Outfit");
    await document.fonts.load("600 40px Outfit");
    await document.fonts.load("700 46px 'Noto Kufi Arabic'", "العالم يتحرّك معك");
    const icon = await load("../icons/favicon.svg");
    const signOff = await load("../icons/by-alajeer-dark.svg");

    const results = {};
    function canvas(name, w, h) {
      const c = document.createElement("canvas");
      c.width = w;
      c.height = h;
      c.title = name;
      document.getElementById("out").append(name, c);
      return c;
    }

    // App icons: the rounded symbol at each size.
    for (const [name, size] of [["icon-16.png", 16], ["icon-32.png", 32], ["icon-48.png", 48], ["apple-touch-icon.png", 180], ["icon-192.png", 192], ["icon-512.png", 512]]) {
      const c = canvas(name, size, size);
      const ctx = c.getContext("2d");
      if (name === "apple-touch-icon.png") {
        // iOS rounds the corners itself, so fill edge to edge.
        ctx.fillStyle = "#12281C";
        ctx.fillRect(0, 0, size, size);
      }
      ctx.drawImage(icon, 0, 0, size, size);
      results[name] = c.toDataURL("image/png");
    }

    // Maskable icon: full-bleed background, symbol inside the 80% safe zone.
    {
      const size = 512, c = canvas("icon-maskable-512.png", size, size), ctx = c.getContext("2d");
      ctx.fillStyle = "#12281C";
      ctx.fillRect(0, 0, size, size);
      const inner = size * 0.82;
      ctx.drawImage(icon, (size - inner) / 2, (size - inner) / 2, inner, inner);
      results["icon-maskable-512.png"] = c.toDataURL("image/png");
    }

    // Share card (Open Graph), 1200×630: same family layout as AraBiC, in MimicGYM's own colours.
    {
      const W = 1200, H = 630, c = canvas("og-image.png", W, H), ctx = c.getContext("2d");
      ctx.fillStyle = "#0E1812";
      ctx.fillRect(0, 0, W, H);
      const glow = ctx.createRadialGradient(W * 0.5, -80, 50, W * 0.5, -80, 760);
      glow.addColorStop(0, "#21432D");
      glow.addColorStop(1, "rgba(14,24,18,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, W, H);

      // The coach mid-jab, on the left.
      const s = 300, fx = 205, fy = 330;
      const halo = ctx.createRadialGradient(fx + 80, fy - 60, 10, fx + 80, fy - 60, 260);
      halo.addColorStop(0, "rgba(126,224,129,0.16)");
      halo.addColorStop(1, "rgba(126,224,129,0)");
      ctx.fillStyle = halo;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "rgba(255,255,255,0.06)";
      ctx.beginPath();
      ctx.ellipse(fx + 20, fy + 0.62 * s, s * 0.42, s * 0.05, 0, 0, Math.PI * 2);
      ctx.fill();
      drawFigure(ctx, punch.coach(0, 1).pose, fx, fy, s, { body: "#EEF5EF", back: "#6D8A78" });

      // Wordmark, then each language on its own line.
      const cx = 770;
      ctx.textBaseline = "alphabetic";
      ctx.font = "800 132px Outfit";
      const a = ctx.measureText("Mimic").width, b = ctx.measureText("GYM").width;
      ctx.textAlign = "left";
      ctx.fillStyle = "#EEF5EF";
      ctx.fillText("Mimic", cx - (a + b) / 2, 250);
      ctx.fillStyle = "#7EE081";
      ctx.fillText("GYM", cx - (a + b) / 2 + a, 250);
      ctx.textAlign = "center";
      ctx.fillStyle = "#EEF5EF";
      ctx.font = "700 46px 'Noto Kufi Arabic'";
      ctx.direction = "rtl";
      ctx.fillText("العالم يتحرّك معك", cx, 352);
      ctx.direction = "ltr";
      ctx.fillStyle = "#9DB3A4";
      ctx.font = "600 38px Outfit";
      ctx.fillText("Move. The world moves with you.", cx, 425);

      // Official "by Alajeer · من الأجير" sign-off.
      const sh = 92, sw = (sh * signOff.naturalWidth) / signOff.naturalHeight;
      ctx.drawImage(signOff, cx - sw / 2, 488, sw, sh);
      results["og-image.png"] = c.toDataURL("image/png");
    }

    window.iconResults = results;
    document.getElementById("dl").onclick = () => {
      for (const [name, url] of Object.entries(results)) {
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        a.click();
      }
    };
  </script>
</body>
</html>
